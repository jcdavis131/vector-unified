[tool.ruff]
target-version = "py311"
line-length = 120
exclude = ["assets/*","data/*","__pycache__",".venv","dist",".git",".vector-hub","node_modules"]

[tool.ruff.lint]
select = ["E","W","F","I","B","C4","UP","N","S","PTH","TCH","RUF"]
ignore = ["S101","S603","S607","N803","N806","N812","E501","E722","S110","RUF001","RUF002","RUF003","E701","E702","E741","E402","S108","S310","S311","C414","UP038","B007","B023","N802","F841","RUF005","PTH123","C416","S112","UP031","RUF007","S314","S324","C401","C408","PTH110","PTH118","PTH120","PTH103","S113","S301","S307"]
fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"pipeline/*" = ["E402","TCH","S110","E722","E501"]
"operator/*" = ["E501","E702","F401","I001"]
"assets/*" = ["ALL"]
