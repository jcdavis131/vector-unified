<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>lane status</title>
<style>
:root{
  --bg:#0f1113; --panel:#171a1d; --line:#262b30; --ink:#e8eaed; --dim:#8b949e;
  --ok:#3fb950; --warn:#d29922; --bad:#f85149; --acc:#58a6ff;
  --mono:ui-monospace,"Cascadia Mono","SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:light){
  :root{--bg:#f6f8fa;--panel:#fff;--line:#d8dee4;--ink:#1f2328;--dim:#636c76;
        --ok:#1a7f37;--warn:#9a6700;--bad:#cf222e;--acc:#0969da;}
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:13px/1.45 var(--mono);
     padding:14px;display:flex;flex-direction:column;gap:12px;overflow:hidden}
header{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
h1{font-size:15px;letter-spacing:.04em;text-transform:uppercase;font-weight:600}
.meta{color:var(--dim);font-size:11.5px;display:flex;gap:14px;flex-wrap:wrap;margin-left:auto}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);
     margin-right:5px;vertical-align:middle;animation:p 2.4s ease-in-out infinite}
@keyframes p{0%,100%{opacity:1}50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.dot{animation:none}}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:9px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:7px;
      padding:9px 11px;border-left-width:3px}
.tile.ok{border-left-color:var(--ok)} .tile.warn{border-left-color:var(--warn)}
.tile.bad{border-left-color:var(--bad)}
.tile .l{color:var(--dim);font-size:10.5px;text-transform:uppercase;letter-spacing:.05em}
.tile .v{font-size:19px;font-weight:600;margin:2px 0 1px;font-variant-numeric:tabular-nums}
.tile .s{color:var(--dim);font-size:11px}
main{display:grid;grid-template-columns:1fr 1fr;gap:12px;flex:1;min-height:0}
section{background:var(--panel);border:1px solid var(--line);border-radius:7px;
        display:flex;flex-direction:column;min-height:0}
section h2{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);
           padding:8px 11px;border-bottom:1px solid var(--line);font-weight:600}
.body{overflow-y:auto;padding:4px 0;flex:1;min-height:0}
.row{display:flex;gap:9px;padding:4px 11px;align-items:baseline}
.row:hover{background:rgba(127,127,127,.07)}
.sha{color:var(--acc);flex:0 0 54px;font-size:11.5px}
.repo{color:var(--dim);flex:0 0 52px;font-size:10.5px}
.ago{color:var(--dim);flex:0 0 42px;text-align:right;font-size:11px;
     font-variant-numeric:tabular-nums}
.subj{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}
.need{padding:7px 11px;border-bottom:1px solid var(--line)}
.need:last-child{border-bottom:0}
.need .k{font-size:10px;text-transform:uppercase;letter-spacing:.05em;
         padding:1px 5px;border-radius:3px;margin-right:6px}
.k.decision{background:rgba(88,166,255,.16);color:var(--acc)}
.k.open{background:rgba(210,153,34,.16);color:var(--warn)}
.k.alert{background:rgba(248,81,73,.16);color:var(--bad)}
.need .w{font-size:12px}
.need .p{color:var(--dim);font-size:10.5px;margin-top:2px}
.empty{color:var(--dim);padding:11px;font-size:12px}
</style>
</head>
<body>
<header>
  <h1><span class="dot" id="dot"></span>lane status</h1>
  <div class="meta">
    <span id="repos"></span>
    <span>refreshed <b id="gen">–</b></span>
    <span>next in <b id="cd">10</b>s</span>
  </div>
</header>

<div class="tiles" id="tiles"></div>

<main>
  <section>
    <h2>needs you</h2>
    <div class="body" id="needs"></div>
  </section>
  <section>
    <h2>what changed</h2>
    <div class="body" id="commits"></div>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
let left = 10;

function esc(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML }

async function tick(){
  try{
    const r = await fetch('/status.json', {cache:'no-store'});
    const d = await r.json();
    $('gen').textContent = d.generated;
    $('dot').style.background = 'var(--ok)';

    $('repos').innerHTML = d.repos.map(r =>
      `${esc(r.name.replace('vector-',''))} <b>${esc(r.branch)}</b>@${esc(r.sha)}` +
      (r.dirty ? ` <span style="color:var(--warn)">${r.dirty}&#9679;</span>` : '') +
      (r.unpushed !== '0' ? ` <span style="color:var(--acc)">&#8593;${esc(r.unpushed)}</span>` : '')
    ).join(' &nbsp;·&nbsp; ');

    $('tiles').innerHTML = d.tiles.map(t =>
      `<div class="tile ${t.state}"><div class="l">${esc(t.label)}</div>
       <div class="v">${esc(String(t.value))}</div><div class="s">${esc(t.sub)}</div></div>`
    ).join('');

    $('needs').innerHTML = d.needs_you.length ? d.needs_you.map(n =>
      `<div class="need"><div><span class="k ${n.kind}">${esc(n.kind)}</span>
       <span class="w">${esc(n.what)}</span></div>
       <div class="p">${esc(n.where)}</div></div>`).join('')
      : '<div class="empty">nothing waiting on you</div>';

    $('commits').innerHTML = d.commits.map(c =>
      `<div class="row"><span class="sha">${esc(c.sha)}</span>
       <span class="repo">${esc(c.repo)}</span>
       <span class="subj" title="${esc(c.subject)}">${esc(c.subject)}</span>
       <span class="ago">${esc(c.ago)}</span></div>`).join('');
  }catch(e){
    $('dot').style.background = 'var(--bad)';
    $('gen').textContent = 'unreachable';
  }
  left = 10;
}

setInterval(() => { left--; $('cd').textContent = left > 0 ? left : 0;
                    if (left <= 0) tick(); }, 1000);
tick();
</script>
</body>
</html>
